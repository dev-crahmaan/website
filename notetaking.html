<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteFlow</title>
    <link rel="stylesheet" href="notestyle.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
  <div class="logo">
     <div class="logo-icon">N</div>
  <span>NoteFlow</span>
     </div>
 <button class="new-note-btn" id="newNoteBtn">
  <span>+</span> New Note</button> <nav>
  <button class="nav-item active" data-filter="all">
 <span>📝</span>
 <span class="count" id="allCount">0</span>
 </button>
     <button class="nav-item" data-filter="pinned">
 <span>📌</span>
     <span class="count" id="pinnedCount">0</span></button></nav>
      <div class="sidebar-bottom">
         <button class="theme-btn" id="themeBtn">
 <span id="themeIcon">☾</span>
    <span>Dark Mode</span>
     </button>
 </div>
  </aside>
      <main class="main">
 <header class="topbar">
  <div>
 <h1>My Notes</h1>
  <p>Capture your ideas and thoughts.</p>
  </div>
<div class="search-box">
     <span>⌕</span>
 <input
         type="text"
          id="searchInput"  
           placeholder="Search notes..." >
</div
</header>
 <section class="notes-area">
 <div class="notes-header">
 <h2 id="sectionTitle">All Notes</h2>
 <span id="notesCount">0 notes</span>
</div>
<div class="notes-grid" id="notesGrid"></div>
 <div class="empty-state" id="emptyState">
 <div class="empty-icon">📝</div>
 <h3>No notes yet</h3>
 <p>Create your first note and start capturing your ideas.</p>
 <button id="emptyNewBtn">Create Note</button>
     </div>
   </section>
  </main>
    </div>
    <div class="modal-overlay" id="modal">
    <div class="modal">
   <div class="modal-header">
 <h2 id="modalTitle">Create Note</h2>
 <button class="close-btn" id="closeModal"> </button>
 </div>
 <input
   type="text"
   id="noteTitle"
   class="note-title-input"
   placeholder="Note title..." >
 <textarea
      id="noteContent"
      placeholder="Write your note here..."  ></textarea>
  <div class="modal-footer">
     <button class="cancel-btn" id="cancelBtn"> </button>
     <button class="save-btn" id="saveBtn"> </button>
</div>
 </div>
</div>
    <script src="notescript.js"></script>
</body>
</html>
